apiVersion: v1
kind: Service
metadata:
  name: {{ include "my-app-workflow.fullname" . }}
  labels:
    {{- include "my-app-workflow.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "my-app-workflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "my-app-workflow.fullname" . }}
