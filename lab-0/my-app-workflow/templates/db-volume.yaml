apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "my-app-workflow.fullname" . }}-db
  labels:
    {{- include "my-app-workflow.selectorLabels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.db.storage }}
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    path: {{ .Values.db.path }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - docker-desktop

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "my-app-workflow.fullname" . }}-db-pv
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  volumeName: {{ include "my-app-workflow.fullname" . }}-db
  resources:
    requests:
      storage: {{ .Values.db.storage }}
